<!DOCTYPE html>
<html><head><style>
body {margin:0;width:1080px;height:1920px;background:#111625;color:white;font-family:sans-serif;}
.scene {width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;}
.number {font-size:120px;font-weight:900;color:#F97316;}
.label {font-size:36px;color:#a89888;margin-top:20px;}
.subtitle {position:absolute;bottom:200px;font-size:32px;line-height:1.5;text-align:center;padding:0 60px;}
</style></head><body><div id="app" class="scene"></div>
<script>
function renderScene(scene) {
  const app = document.getElementById('app');
  if (scene.type === 'data_card') {
    app.innerHTML = `<div class="number">${scene.data.number}</div><div class="label">${scene.data.label}</div><div class="subtitle">${scene.narration}</div>`;
  }
}
</script></body></html>
